version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      root-dev:
        dependency-type: development
      root-prod:
        dependency-type: production

    # `stream-json` 3 replaced `withParserAsStream` with a composable API, so it
    # needs a code migration and Node has nothing to do with it — #467.
    #
    # The `better-sqlite3` 13 and `undici` 8 holds are GONE: they required Node
    # >= 22 / >= 22.19 and the host now runs 24 (#458). Dependabot will re-propose
    # both majors; `ci` decides, on 24.
    ignore:
      - dependency-name: stream-json
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/extension"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      extension-dev:
        dependency-type: development
    ignore:
      # jsdom 30 makes `src/sites/conformance.test.ts` fail: "re-badges after the
      # grid is replaced with fresh nodes" gets null where it expects a badge. The
      # test asserts a MutationObserver re-badged within 50 ms — a timing
      # assumption jsdom 30 invalidated.
      #
      # It was ALSO held because it could not be reproduced on a Node 20 host
      # (jsdom 30 pulls undici 8, which needs Node >= 22.19). That excuse died with
      # #458 — the host runs 24 — but the defect did not. Tracked as #468; the hold
      # stays until it is fixed rather than waited-out.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
