version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      root-dev:
        dependency-type: development
      root-prod:
        dependency-type: production

    # `stream-json` 3 replaced `withParserAsStream` with a composable API, so it
    # needs a code migration and Node has nothing to do with it — #467.
    #
    # The `better-sqlite3` 13 and `undici` 8 holds are GONE: they required Node
    # >= 22 / >= 22.19 and the host now runs 24 (#458). Dependabot will re-propose
    # both majors; `ci` decides, on 24.
    ignore:
      - dependency-name: stream-json
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/extension"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      extension-dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
