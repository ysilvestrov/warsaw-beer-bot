name: AI PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest

    # #435: a Dependabot PR leaves exactly one file in review scope —
    # package.json, whose diff is version-range strings (`prReview.ignore` in
    # detent.json already drops package-lock.json). A reviewer
    # built to find correctness bugs in code gets a diff with no code. And with
    # auto-merge armed the PR merges on the required checks, so any comment
    # lands on something already merged and deployed — there is no point at
    # which a reaction could occur. Replaced by deterministic checks: ci, the
    # audit-diff, and manifestScope().
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      # A commit, not a tag, because this action receives the key.
      - uses: ysilvestrov/detent@47db7e88f94f97a2cc545e2a0b0d4cb351ac654a # v0.5.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
