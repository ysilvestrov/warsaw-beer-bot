name: Production dependency audit

on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # tsx for the verdict CLI (#795). --ignore-scripts: no package's install
      # script runs, so this job stays as inert as when it installed nothing.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        id: audit
        run: |
          set -uo pipefail
          # npm's exit code cannot tell an advisory from a failure to audit: npm 12
          # exits 1 for both (#795). The verdict CLI reads the JSON and exits
          # 0 clean / 1 advisory / 2 could not run. printf, not npm, feeds the pipe,
          # so pipefail sees the CLI's status alone. GitHub runs this as `bash -e`:
          # the `||` keeps a non-zero code from killing the step before `state` is
          # written (#789).
          report=$(npm audit --omit=dev --json 2>/dev/null) || true
          code=0
          printf '%s' "$report" | ./node_modules/.bin/tsx scripts/autodeploy/audit-verdict-cli.ts > audit.txt 2>&1 || code=$?
          cat audit.txt
          case "$code" in
            0) echo "state=clean"   >> "$GITHUB_OUTPUT" ;;
            1) echo "state=vulnerable" >> "$GITHUB_OUTPUT" ;;
            # The audit did not produce a report (registry outage, ENOLOCK, a CLI
            # crash): we do NOT know whether production is exposed. Silence here
            # is exactly the failure this workflow exists to prevent, so it is
            # reported — but as what it is.
            *) echo "state=unknown" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.audit.outputs.state != 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.audit.outputs.state }}
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          set -euo pipefail
          marker='<!-- prod-dependency-audit -->'
          title='Production dependency advisory'

          if [ "$STATE" = 'vulnerable' ]; then
            headline='`npm audit --omit=dev` reports a high or critical advisory in a **production** dependency on `main`.'
            tail='If no Dependabot pull request exists for this, the fix needs a parent package bumped by hand — Dependabot opens nothing in that case, and its silence looks exactly like safety. See #435.'
          else
            headline="**The audit could not run** (verdict exit ${EXIT_CODE}). This is not a finding about production — it means we currently do not know whether production is exposed."
            tail='Re-run the workflow. If it keeps failing, the daily check is blind and #435 has lost its independent observer.'
          fi

          body="${marker}"$'\n\n'"${headline}"$'\n\n```\n'"$(cat audit.txt)"$'\n```\n\n'"${tail}"

          # Find OUR issue by its own label, never by title — a title search can
          # match an issue a human opened, and the clean branch below CLOSES what
          # it finds.
          existing=$(gh issue list --state open --label prod-audit --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label prod-audit --body "$body"
          fi

      - name: Close the issue when production is clean
        if: steps.audit.outputs.state == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --label prod-audit --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment '`npm audit --omit=dev` is clean again.'
          fi

      # The issue is the report; a red run is the second signal (GitHub mails the
      # owner of a failed scheduled run). Last, so the issue step always runs first.
      - name: Fail the run when production is not clean
        if: steps.audit.outputs.state != 'clean'
        run: exit 1
