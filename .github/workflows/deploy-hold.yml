name: Deploy hold

# Merge-deploy: the title of a PR says whether its deploy will be unattended.
# Re-runs when the title or the labels change, not only on pushes. Not a
# required check at first; the host re-derives holds on its own.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  deploy-hold:
    name: deploy-hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Title marker, label and hold paths agree
        # `shell: bash` = -eo pipefail: a failed diff must fail the step, not
        # feed an empty list into an "OK".
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        # HEAD is the PR's merge ref: its first parent is the base it merged
        # onto, so this is exactly the PR's own contribution — base.sha on an
        # edited/labeled event may be older and would count others' changes.
        # --no-renames: a rename would otherwise report only its destination,
        # hiding a held source path.
        run: git diff --no-renames --name-only HEAD^1 HEAD | npx tsx scripts/autodeploy/deploy-hold-check.ts
