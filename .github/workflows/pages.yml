name: Deploy privacy policy to Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/extension-install-*.md', 'docs/mcp-uk.md', 'extension/CHANGELOG.md', 'scripts/render-docs.ts', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run render-docs
      - uses: actions/configure-pages@v6
      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # 2026-11-23 (#1000): deploy-pages lists the run's artifacts ~0.3 s after
      # the upload is finalized and does not retry. Twice in a row the listing
      # still said "Found 0 artifact(s)" (it showed the artifact a minute
      # later). Wait until the listing shows THIS job's artifact, by its id:
      # a re-run already has the earlier attempt's artifact in the listing.
      # (A re-run still fails in deploy-pages on "Multiple artifacts"; start
      # a fresh run with workflow_dispatch instead.) A failed API call is
      # retried like a miss, not fatal.
      - name: Wait until the artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          : "${ARTIFACT_ID:?upload-pages-artifact gave no artifact_id}"
          for i in $(seq 1 24); do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[].id') || ids=""
            if printf '%s\n' "$ids" | grep -qx "$ARTIFACT_ID"; then echo "artifact $ARTIFACT_ID listed after $i check(s)"; exit 0; fi
            sleep 5
          done
          echo "::error::github-pages artifact $ARTIFACT_ID not listed after 2 minutes"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
