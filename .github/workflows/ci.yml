name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            dir: .
            node: 24
          - name: extension
            dir: extension
            node: 24
    steps:
      - uses: actions/checkout@v7

      # Both legs run the version production runs. This is not a convention: it is
      # asserted by scripts/workflow-node-version.test.ts against engines.node.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ matrix.dir }}

      - name: Typecheck
        run: npm run typecheck
        working-directory: ${{ matrix.dir }}

      - name: Test
        run: npm test
        working-directory: ${{ matrix.dir }}

  # The bot's runtime image (docs/superpowers/specs/2026-10/2026-10-11-wbb-image-deployment-design.md
  # §3.1, §3.3; plan docs/superpowers/plans/2026-10/2026-10-11-wbb-image-deployment-core.md): the
  # payload of exactly this SHA, built inside deploy/image/Dockerfile on the runtime's own Debian,
  # proven by scripts/image-smoke.sh (read-only, no network), audited as the host will audit it,
  # labelled with wbb.content. On every event; only a main push publishes it to GHCR with a build
  # provenance attestation. One manifest, not an index (--provenance=false --sbom=false), so the
  # digest the attestation names is the image's own. The host does not consume it yet.
  # Its own pinned platform: the build's runner must not move with ubuntu-latest.
  image:
    name: image
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 30
    # Job-level and the same on every event; the steps that use the write scopes run on a
    # main push only (each carries the main-push `if:`).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REPOSITORY: ghcr.io/ysilvestrov/warsaw-beer-bot
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: >-
          docker buildx build -f deploy/image/Dockerfile --platform linux/amd64
          --provenance=false --sbom=false --load
          --build-arg SOURCE_SHA="$GITHUB_SHA" --build-arg RUN_ID="$GITHUB_RUN_ID"
          --build-arg RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" -t wbb-image:smoke .

      - name: Smoke
        run: scripts/image-smoke.sh wbb-image:smoke "$GITHUB_SHA"

      # Spec §4.2: the production tree as it ships, audited from the image exactly as the host's
      # deploy-time audit runs it. npm's exit code cannot tell an advisory from a failure to audit;
      # the verdict CLI decides (0 clean, 10 advisory, anything else could not run) and any
      # non-zero is red. The pipeline's status is the CLI's.
      - name: Audit production dependencies
        run: |
          set +e
          docker run --rm --tmpfs /tmp --user 999:999 wbb-image:smoke \
            sh -c 'cd /app && npm audit --omit=dev --json | node_modules/.bin/tsx scripts/autodeploy/audit-verdict-cli.ts'
          code=$?
          case $code in
            0) exit 0 ;;
            10) echo "::error::high or critical advisory in production dependencies"; exit 1 ;;
            *) echo "::error::could not audit production dependencies (exit $code)"; exit 1 ;;
          esac

      # wbb.content (spec §4.1) is known only once the payload exists: the image carries it in
      # /app/.content-digest, and a second, config-only layer turns it into the label.
      - name: Label content
        id: label
        run: |
          content=$(docker run --rm --network=none wbb-image:smoke cat /app/.content-digest)
          [[ $content =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad /app/.content-digest: '$content'"; exit 1; }
          printf 'FROM wbb-image:smoke\nLABEL wbb.content=%s\n' "$content" \
            | docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
                -t "$REPOSITORY:$GITHUB_SHA" -
          labels=$(docker image inspect "$REPOSITORY:$GITHUB_SHA" \
            --format '{{index .Config.Labels "wbb.content"}} {{index .Config.Labels "org.opencontainers.image.revision"}}')
          [ "$labels" = "$content $GITHUB_SHA" ] || { echo "::error::labels '$labels'"; exit 1; }
          echo "content=$content" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # The digest is the registry's, read back twice: from the push and from the registry
      # itself, which must also say it is a single image manifest, not an index (spec §3.3).
      - name: Push
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ref="$REPOSITORY:$GITHUB_SHA"
          pushed=$(docker push "$ref" | tee /dev/stderr \
            | sed -n 's/^.*: digest: \(sha256:[0-9a-f]\{64\}\) size: [0-9]*$/\1/p' | tail -n 1)
          manifest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}')
          digest=$(jq -r .digest <<<"$manifest")
          media=$(jq -r .mediaType <<<"$manifest")
          case $media in
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json) ;;
            *) echo "::error::$ref is $media, not a single image manifest"; exit 1 ;;
          esac
          [ -n "$pushed" ] && [ "$digest" = "$pushed" ] \
            || { echo "::error::push said '$pushed', the registry says '$digest'"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          CONTENT: ${{ steps.label.outputs.content }}
        run: |
          line="IMAGE-DIGEST sha=$GITHUB_SHA digest=$DIGEST content=$CONTENT"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

  # Single stable name for branch protection and auto-merge to depend on.
  # `if: always()` so this job runs even when `build` failed — otherwise a
  # failed matrix leg would leave the required check *pending* forever and
  # every PR would hang instead of going red.
  # `image` must succeed on every event (image spec §3.1): it builds and smokes the
  # runtime on a PR too, so skipped is never accepted.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [build, image]
    if: always()
    steps:
      - name: Report results
        env:
          BUILD: ${{ needs.build.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "build: $BUILD; image: $IMAGE"
          [ "$BUILD" = success ] || exit 1
          [ "$IMAGE" = success ]
