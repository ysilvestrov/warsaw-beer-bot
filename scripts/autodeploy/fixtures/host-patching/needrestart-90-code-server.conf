# 2026-09-03: unattended-upgrades оновив ncurses/libtinfo/libevent, needrestart побачив, що
# code-server тримає ці бібліотеки відкритими, і рестартував юніт. А в code-server@.service
# KillMode=control-group — тобто SIGTERM летить УСЬОМУ cgroup: ptyHost, усі термінали і все,
# що в них живе, включно з агентськими сесіями. Так о 06:18 UTC обірвалася робоча сесія.
#
# code-server — редактор, а не демон, що обслуговує трафік: ціна пропущеного рестарту в тому,
# що він доживає на старій бібліотеці до наступного ручного рестарту. Ціна автоматичного
# рестарту — втрачена робота. Друге дорожче.
$nrconf{override_rc}{qr(^code-server)} = 0;
